apiVersion: v1
kind: Service
metadata:
  name: {{ include "learningsteps.fullname" . }}-svc
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ include "learningsteps.fullname" . }}
  ports:
    - name: http 
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
